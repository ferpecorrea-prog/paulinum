[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paulinum"
version = "0.2.0-r"
description = "Verificación convergente de la autoría del corpus paulino canónico (reconstrucción del laboratorio publicado)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "matplotlib", "lxml", "pyyaml", "requests", "tqdm"]

[tool.setuptools]
packages = ["paulinum"]
