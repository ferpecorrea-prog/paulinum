[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paulinum"
version = "1.0.0"
description = "Verificación convergente de la autoría del corpus paulino canónico"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "matplotlib", "lxml", "pyyaml", "requests", "tqdm"]

[tool.setuptools]
packages = ["paulinum"]
