name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias (versiones fijadas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pruebas de referencia (selftest, 25 comprobaciones deterministas)
        run: python scripts/selftest.py
      - name: pytest
        run: pytest -q
