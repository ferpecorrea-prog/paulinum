# Laboratorio público de paulinum 1.0: ejecuta una etapa (o un trozo de ella) de una campaña en un ejecutor de GitHub
# Actions y envía los resultados al repositorio. Cada ejecución queda registrada con su bitácora y su registro (log).
# Reproducibilidad: el ejecutor parte de cero (descarga los textos de sus repositorios, construye el corpus y, si la
# rejilla usa lemma_dict, reconstruye el lexicón desde Diorisis y comprueba su huella frente a la sellada).
# Ninguna credencial: usa el GITHUB_TOKEN del propio flujo para escribir en el repositorio.
name: campana

on:
  workflow_dispatch:
    inputs:
      config:
        description: "configuración (p. ej. config/paulinum_1_0.yaml o config/sens/paulinum_1_0_nucleos.yaml)"
        required: true
        default: "config/paulinum_1_0.yaml"
      run:
        description: "nombre de la ejecución (results/<run>); vacío = el «nombre» de la configuración"
        required: false
        default: ""
      stage:
        description: "etapas separadas por comas (specs,calibration,ledger,variables,rolling,extras) o guion (bootstrap, veredicto, svm, anotacion, ruido)"
        required: true
        default: "specs"
      familias:
        description: "familias separadas por comas (impostores,ncd,dirichlet); vacío = las activas"
        required: false
        default: ""
      solo:
        description: "índices de especificación separados por comas (para trocear); vacío = todas"
        required: false
        default: ""
      horas:
        description: "tiempo máximo de cálculo en horas (después se envía lo hecho, reanudable)"
        required: false
        default: "5"
      modelo:
        description: "solo para stage=anotacion: modelo spaCy de griego antiguo (grc_odycy_joint_sm, grc_proiel_sm…)"
        required: false
        default: "grc_odycy_joint_sm"

# Una ejecución por combinación de campaña × familias × especificaciones: trozos distintos de la misma campaña (p. ej.
# las dos especificaciones de NCD con solo=0 y solo=1) corren en paralelo; escriben archivos de especificación
# distintos y las bitácoras se fusionan por unión (.gitattributes). Las etapas de cierre (calibration, ledger, …) se
# lanzan solas, cuando no queda ninguna ejecución de specs de esa campaña en curso.
concurrency:
  group: campana-${{ github.event.inputs.run || github.event.inputs.config }}-${{ github.event.inputs.stage }}-${{ github.event.inputs.familias }}-${{ github.event.inputs.solo }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  campana:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ponerse al día con main (las ejecuciones en cola parten de los resultados ya publicados)
        run: |
          # `workflow_dispatch` fija el commit en el momento del lanzamiento; una ejecución que esperó en cola
          # arrancaría sin los resultados que otras publicaron entre tanto y su envío final chocaría con ellos.
          # Se avanza al `main` actual: el código sigue siendo el sellado (la huella se recomputa igual) y los
          # parciales de otras ejecuciones se reanudan en vez de repetirse.
          git config user.name "paulinum-lab"
          git config user.email "paulinum-lab@users.noreply.github.com"
          git pull --ff-only origin main || git pull --rebase origin main
          echo "commit de trabajo: $(git rev-parse --short HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias (versiones fijadas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Textos de origen (huellas comprobadas contra data/provenance.json)
        run: |
          python -m paulinum fetch --tier 4 --editions
          # `fetch` reescribe data/provenance.json (archivo versionado) con las huellas y la hora de cada descarga.
          # Se comprueba que cada huella coincide con la registrada en el repositorio y se restaura el archivo canónico,
          # para que el árbol de trabajo quede limpio (si no, `git pull --rebase` del envío final falla).
          git show HEAD:data/provenance.json > /tmp/provenance_repo.json
          python - <<'PY'
          import json, sys
          repo = json.load(open("/tmp/provenance_repo.json"))["files"]
          nuevo = json.load(open("data/provenance.json"))["files"]
          dif, nuevos, faltan = [], [], []
          for k, v in nuevo.items():
              if v.get("status") not in ("ok", "local"):
                  continue
              r = repo.get(k)
              if r is None:
                  nuevos.append(k)
              elif r.get("sha256") and v.get("sha256") != r.get("sha256"):
                  dif.append((k, r.get("sha256", "")[:12], v.get("sha256", "")[:12]))
          for k, r in repo.items():
              if r.get("status") == "ok" and k not in nuevo:
                  faltan.append(k)
          print(f"huellas comprobadas: {len(nuevo)} archivos; iguales al repositorio: {len(nuevo) - len(dif) - len(nuevos)}; "
                f"no registrados antes: {len(nuevos)}; ausentes ahora: {len(faltan)}")
          for k in nuevos[:20]: print("  [nuevo]", k)
          for k in faltan[:20]: print("  [ausente]", k)
          if dif:
              for k, a, b in dif: print(f"::error::huella distinta en {k}: repositorio {a}… descargado {b}…")
              sys.exit(1)
          PY
          git checkout -- data/provenance.json
      - name: Lexicón uniforme desde Diorisis (solo si la rejilla usa lemma_dict; huella comprobada)
        run: |
          if grep -q "lemma_dict" "${{ github.event.inputs.config }}"; then
            mkdir -p data/local
            # Diorisis (Vatri y McGillivray 2018, CC BY-NC-SA 4.0; figshare, artículo 6187256): no se redistribuye.
            curl -sSL -o data/local/figshare_6187256.zip "https://figshare.com/ndownloader/articles/6187256/versions/1"
            python - <<'PY'
          import hashlib, os, shutil, sys, zipfile
          src = "data/local/figshare_6187256.zip"
          dst = "data/local/Diorisis.zip"
          with zipfile.ZipFile(src) as z:
              names = z.namelist()
              inner = [n for n in names if n.lower().endswith(".zip")]
              if any(n.lower().endswith(".xml") for n in names):
                  shutil.copyfile(src, dst)            # el archivo ya es el corpus (XML en la raíz)
              elif len(inner) == 1:                    # el zip del artículo envuelve Diorisis.zip
                  with z.open(inner[0]) as f, open(dst, "wb") as g:
                      shutil.copyfileobj(f, g)
              else:
                  print("::error::no se reconoce el contenido descargado de figshare:", names[:10]); sys.exit(1)
          h = hashlib.sha256(open(dst, "rb").read()).hexdigest()
          print("Diorisis.zip:", h, "(el ejemplar usado para el sello: fb32b7ff4bcfc433f1234aff8134096f524c9a32accbfdf0a072df4a5f019b65)")
          PY
            python scripts/construir_lexicon.py --diorisis-zip data/local/Diorisis.zip
            python - <<'PY'
          import hashlib, json, os, sys
          h = hashlib.sha256(open("data/cache/lexicon_uniforme.tsv", "rb").read()).hexdigest()
          sello = json.load(open("protocols/paulinum_1_0/SELLO.json"))
          esperado = sello["files"].get("data/cache/lexicon_uniforme.tsv")
          print("lexicón:", h, "| sellado:", esperado)
          if esperado and h != esperado:
              print("::error::el lexicón reconstruido no coincide con el sellado")
              sys.exit(1)
          PY
          fi
      - name: Corpus
        id: corpus
        # Si falla, la ejecución sigue hasta el envío para que el registro del fallo quede publicado en results/
        # (los registros del ejecutor no son legibles sin sesión de GitHub); el último paso marca la ejecución como fallida.
        continue-on-error: true
        run: |
          RUN="${{ github.event.inputs.run }}"
          NAME="${RUN:-$(python -c "import yaml,sys; print(yaml.safe_load(open('${{ github.event.inputs.config }}'))['nombre'])")}"
          mkdir -p "results/$NAME"
          LOG="results/$NAME/lab_corpus_${{ github.run_id }}.log"
          {
            python -m paulinum build --config "${{ github.event.inputs.config }}" && \
            python -m paulinum inventory --config "${{ github.event.inputs.config }}" ${{ github.event.inputs.run != '' && format('--run {0}', github.event.inputs.run) || '' }}
          } 2>&1 | tee "$LOG"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Ejecutar (con tope de tiempo; reanudable por problema)
        if: steps.corpus.outcome == 'success'
        run: |
          RUN="${{ github.event.inputs.run }}"
          FAM="${{ github.event.inputs.familias }}"
          SOLO="${{ github.event.inputs.solo }}"
          STAGE="${{ github.event.inputs.stage }}"
          ARGS="--config ${{ github.event.inputs.config }} --workers 4"
          [ -n "$RUN" ] && ARGS="$ARGS --run $RUN"
          [ -n "$FAM" ] && ARGS="$ARGS --familias $FAM"
          [ -n "$SOLO" ] && ARGS="$ARGS --solo $SOLO"
          NAME="${RUN:-$(python -c "import yaml,sys; print(yaml.safe_load(open('${{ github.event.inputs.config }}'))['nombre'])")}"
          instalar_modelo() {
            # D-016/D-023: el modelo se instala aquí (huggingface.co solo se alcanza desde el ejecutor). OdyCy (chcaa,
            # MIT; spaCy >=3.7.4,<3.8) se instala desde su wheel publicado; greCy se instala con `python -m grecy install`.
            MODELO="${{ github.event.inputs.modelo }}"; MODELO="${MODELO:-grc_odycy_joint_sm}"
            mkdir -p results/anotacion
            LOG="results/anotacion/instalacion_${MODELO}_${{ github.run_id }}.log"   # diagnóstico público de la instalación
            {
              echo "== instalación de $MODELO (ejecución ${{ github.run_id }}) =="
              case "$MODELO" in
                # spaCy 3.7 exige numpy < 2 (thinc 8.2) y su CLI importa `click`, que typer >= 0.20 ya no arrastra: en este
                # paso, y solo en este, numpy baja a 1.26; la anotación no calcula ninguna cifra de la campaña.
                grc_odycy_*) pip install "spacy>=3.7.4,<3.8.0" click 2>&1 | tail -n 5
                             # el wheel publicado se llama «<modelo>-any-py3-none-any.whl» (sin versión) y pip moderno lo
                             # rechaza por el nombre; se descarga y se instala con un nombre de archivo válido (versión 0.7.0
                             # según su meta.json del 27-IX-2026; el contenido es el mismo).
                             curl -sSL -o "/tmp/${MODELO}-0.7.0-py3-none-any.whl" "https://huggingface.co/chcaa/${MODELO}/resolve/main/${MODELO}-any-py3-none-any.whl"
                             ls -la "/tmp/${MODELO}-0.7.0-py3-none-any.whl"; sha256sum "/tmp/${MODELO}-0.7.0-py3-none-any.whl"
                             pip install "/tmp/${MODELO}-0.7.0-py3-none-any.whl" 2>&1 | tail -n 3 || echo "no se pudo instalar $MODELO" ;;
                *) pip install spacy grecy 2>&1 | tail -n 5; (python -m grecy install "$MODELO" 2>&1 | tail -n 25 || echo "no se pudo instalar $MODELO") ;;
              esac
              python -c "import spacy, numpy; print('spaCy', spacy.__version__, '| numpy', numpy.__version__)" || echo "spaCy no importable"
              pip show "$MODELO" 2>&1 | head -n 3 || true
              python - "$MODELO" <<'PY' || true
          import sys, traceback
          try:
              import spacy
              nlp = spacy.load(sys.argv[1])
              print("carga correcta:", sys.argv[1], nlp.pipe_names)
          except Exception:
              traceback.print_exc()
          PY
            } 2>&1 | tee "$LOG"
          }
          mkdir -p "results/$NAME"
          exec > >(tee -a "results/$NAME/lab_${STAGE//,/_}_${{ github.run_id }}.log") 2>&1
          echo "== ejecución ${{ github.run_id }} · $(date -u +%Y-%m-%dT%H:%M:%SZ) · commit $(git rev-parse --short HEAD) · etapa $STAGE · familias ${FAM:--} · solo ${SOLO:--} =="
          case "$STAGE" in
            bootstrap) timeout ${{ github.event.inputs.horas }}h python scripts/bootstrap_percentil.py --run "$NAME" --metric minmax --config "${{ github.event.inputs.config }}" && timeout ${{ github.event.inputs.horas }}h python scripts/bootstrap_percentil.py --run "$NAME" --metric delta --config "${{ github.event.inputs.config }}" || echo "tope de tiempo o error: se envía lo hecho" ;;
            veredicto) python scripts/veredicto.py --run "$NAME" ;;
            ruido) python -m paulinum build --config config/sens/paulinum_1_0_ediciones.yaml && python scripts/ruido_edicion.py --run "$NAME" --config "${{ github.event.inputs.config }}" --ediciones tischendorf,nestle1904 ;;
            anotacion)
              instalar_modelo
              timeout ${{ github.event.inputs.horas }}h python scripts/anotacion_uniforme.py --edicion sblgnt --modelo "$MODELO" || echo "anotación no disponible o tope de tiempo: se envía el informe" ;;
            diagnostico_anotacion)
              # guion de diagnóstico, fuera del código sellado (diagnostico/): no produce ninguna cifra del protocolo
              instalar_modelo
              timeout ${{ github.event.inputs.horas }}h python diagnostico/anotacion_diagnostico.py --edicion sblgnt --modelo "$MODELO" || echo "diagnóstico no disponible o tope de tiempo" ;;
            svm) timeout ${{ github.event.inputs.horas }}h python scripts/modelo_svm.py --run "$NAME" --features mfw:300,closed:150,char3:600,lemma_dict:300 || echo "tope de tiempo o error: se envía lo hecho" ;;
            *) timeout ${{ github.event.inputs.horas }}h python -m paulinum run $ARGS --stage "$STAGE" || echo "tope de tiempo o error: se envía lo hecho (reanudable)" ;;
          esac
      - name: Enviar resultados al repositorio
        if: always()
        run: |
          git config user.name "paulinum-lab"
          git config user.email "paulinum-lab@users.noreply.github.com"
          git add -A results/
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "[lab] ${{ github.event.inputs.stage }} de ${{ github.event.inputs.run || github.event.inputs.config }} (ejecución ${{ github.run_id }})"
          # Cualquier archivo versionado que la ejecución haya tocado fuera de results/ (p. ej. data/provenance.json)
          # se restaura: solo se publican resultados, y el árbol debe estar limpio para el rebase.
          git checkout -- .
          git status --short | head -20
          enviado=0
          for i in 1 2 3 4 5; do
            # bitácoras y registros se fusionan por unión (.gitattributes); en cualquier otro choque prevalece esta
            # ejecución («theirs» en un rebase), porque los agregados los recalcula la etapa de calibración al final
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then enviado=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "intento $i fallido; se reintenta"
            sleep $((i * 20))
          done
          if [ "$enviado" != "1" ]; then echo "::error::no se pudieron enviar los resultados a main (véase el artefacto de la ejecución)"; exit 1; fi
      - name: Copia de seguridad de results/ como artefacto de la ejecución (por si el envío falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Marcar el fallo del corpus (si lo hubo), una vez publicado su registro
        if: steps.corpus.outcome == 'failure'
        run: |
          echo "::error::la construcción del corpus o del inventario falló; véase results/<run>/lab_corpus_${{ github.run_id }}.log"
          exit 1
